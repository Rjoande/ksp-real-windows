// Real Windows settings - read once per game launch.
//
// Windows are found from each part's own textures and interior; there is no
// per-part configuration. Every key is optional: a missing one keeps its default.

RealWindows
{
    // ---- on / off ----------------------------------------------------------
    toggleKey = Alt+F8             // switches Real Windows on and off in flight ("None": no key). Alt/Ctrl/Shift + a Unity KeyCode
    startEnabled = True            // on or off at the start of each flight scene

    // ---- performance -------------------------------------------------------
    maxDistance = 150              // m: interiors are shown for parts closer than this
    maxInteriors = 32              // at most this many interiors per frame, nearest first
    includeInactiveVessels = True  // also other loaded vessels (docking targets, stations, EVA)
    propDetailPixels = 160         // props are drawn while a part's windows are at least this big on screen (px); 0 = always
    drawInstruments = False        // instrument props (RPM/MAS screens, gauges, switches): many draw calls, unreadable from outside
    crewDetailPixels = 48          // crew moves every frame from this size; smaller, it is updated about once a second; 0 = always
    interiorScale = 1              // resolution of the interior seen through windows (0.1-1); window outlines stay sharp
    interiorShadows = True         // shadows inside interiors
    kerbalShadows = False          // shadows cast by the crew (costs an extra shadow pass every frame)
    interiorRefresh = 1            // s: a still view of the cabin is redrawn this often (lights, screens); 0 = only when the view changes

    // ---- features ----------------------------------------------------------
    renderNeighbours = True        // open hatches look into the next part's interior
    seeThroughWindows = True       // looking through a cabin and out of its far window shows what is behind it. Sky effects
                                   // (atmosphere, clouds, sun flares) don't show through the far side of painted windows
    showInteriorWhenInside = True  // zooming the camera into a part shows its interior whole
    ivaView = True                 // in IVA, other parts' windows seen through your windows show their interiors

    // ---- glass -------------------------------------------------------------
    transmission = 0.85            // 1 = clear glass, lower keeps more of the painted window
    glassTint = 0.92, 0.96, 1.0
    glassEnvironment = True        // the glass reflects the scene around the part; False = the painted window is the reflection
    glassEnvironmentSource = Auto  // Auto: the game's reflection probe when it is on, otherwise a sky/ground gradient. Probe / Synthetic force one
    glassOpacity = Transparent     // what is behind the glass: Transparent = the interior; ReflectionOnly = a dark pane that only reflects (no interior is drawn)
    glassProfile = Clear           // how the glass reflects: Clear (plain glass, the keys above and below), Capsule (coated), Rover, or a GlassProfile below
    glassColor = Neutral           // the tint of the glass: Neutral (none), Smoke, Gold, Green, Amber, or a GlassColor below
    glassBodyTint = 0.77, 0.85, 1.0   // the body of a pane with no interior behind it and no colour: a cool grey (its brightness is the profile's bodyLevel)
    glassNightReflection = 0.02    // what is left of the sky/ground gradient's reflection at night (0 = none)
    glassNightProbe = 1            // the same for the reflection probe's image: 1 = as the game draws it at night, lower dims it
    glassReflection = 1            // reflection at grazing angles; 0 = none
    glassSpecular = 1              // sun glint strength; 0 = none
    glassSmoothness = 0.85         // 0-1: glint size, 1 = pin-point
    glassDirt = 0.3                // smudges and dust; 0 = spotless
    glassDirtScale = 3             // smudges per metre

    // ---- troubleshooting ---------------------------------------------------
    excludeParts =                 // part names whose interiors look broken from outside, separated by |
    flipY = 0                      // set 1 only if the effect appears upside down
    debugCycleKey = KeypadDivide   // a key (Unity KeyCode, e.g. KeypadDivide) that cycles the debug views in flight
    glassCycleKey = KeypadMultiply // LOCAL TEST ONLY - before committing, remove this line and set debugCycleKey back to None
    glassOpacityKey = KeypadMinus  // LOCAL TEST ONLY - remove this line as well
    glassProfileKey = Keypad9      // LOCAL TEST ONLY - steps through the glass profiles
    glassColorKey = Keypad8        // LOCAL TEST ONLY - steps through the glass colours
    glassReloadKey = Keypad7       // LOCAL TEST ONLY - reads the glass keys, profiles and colours of this file again in flight
    verboseLogging = False         // more detail in KSP.log, for bug reports

    // ---- glass profiles and colours ------------------------------------------
    // Every key is optional. Clear takes transmission, glassReflection and
    // glassSmoothness from above. A pane with no interior behind it never uses
    // Clear: it reflects like Capsule.
    GlassProfile
    {
        name = Capsule
        f0 = 0.1                   // reflectance facing the camera (plain glass: 0.04)
        fresnelPower = 5           // how late the reflectance rises towards grazing angles
        smoothness = 0.95          // 1 = mirror-sharp reflection
        reflection = 1             // x the reflectance
        reflectionTint = 0.7       // share of the glass colour in the reflection
        transmission = 0.7         // how much of the interior shows
        transmissionTint = 0.5     // share of the glass colour in what shows through
        bodyLevel = 0.08           // brightness of the pane's own body in full light, where no interior shows
    }
    GlassProfile
    {
        name = Rover
        f0 = 0.05
        fresnelPower = 3
        smoothness = 0.9
        reflection = 1
        reflectionTint = 0.4
        transmission = 0.8
        transmissionTint = 0.5
        bodyLevel = 0.08
    }
    GlassProfile
    {
        name = Clear
        bodyLevel = 0.08
    }
    GlassColor
    {
        name = Smoke
        color = 0.5, 0.5, 0.5
    }
    GlassColor
    {
        name = Gold
        color = 1, 0.76, 0.33
    }
    GlassColor
    {
        name = Green
        color = 0.45, 0.75, 0.5
    }
    GlassColor
    {
        name = Amber
        color = 1, 0.6, 0.2
    }
}
